<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 80" fill="none">
  <!-- ── Icon (80×80) ── -->

  <!-- Iris fill -->
  <ellipse cx="40" cy="40" rx="12" ry="22" fill="rgba(245,158,11,0.12)"/>

  <!-- Outer eye almond -->
  <path
    d="M10 40 Q25 16 40 14 Q55 16 70 40 Q55 64 40 66 Q25 64 10 40Z"
    fill="none"
    stroke="#f59e0b"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Pupil -->
  <rect
    x="37" y="18" width="6" height="44" rx="3"
    fill="#f59e0b"
    opacity="0.85"
  />

  <!-- Left whiskers -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <line x1="9" y1="40" x2="1" y2="40"/>
    <line x1="9" y1="39" x2="1" y2="35"/>
    <line x1="9" y1="41" x2="1" y2="45"/>
  </g>

  <!-- Right whiskers -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <line x1="71" y1="40" x2="79" y2="40"/>
    <line x1="71" y1="39" x2="79" y2="35"/>
    <line x1="71" y1="41" x2="79" y2="45"/>
  </g>

  <!-- ── Wordmark ── -->
  <text
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="18"
    y="36"
  >
    <tspan x="88" fill="#e0e0e0" font-weight="500">Wild</tspan>
    <tspan fill="#f59e0b" font-weight="400">chat</tspan>
    <tspan fill="#e0e0e0" font-weight="500"> Lens</tspan>
  </text>

  <!-- Subtitle -->
  <text
    x="88"
    y="52"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="10"
    fill="#888888"
    font-weight="400"
    letter-spacing="0.04em"
  >conversation analytics</text>
</svg>
